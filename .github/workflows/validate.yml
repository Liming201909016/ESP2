name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Deployed ESP base URL
        required: true
        default: https://app-esp-dev-ygxkqw7r.azurewebsites.net
      dev_bypass:
        description: Target uses the explicit shared DEV identity
        type: boolean
        default: true
      knowledge_evaluation:
        description: Run the full read-only knowledge evaluation and retain a metadata report
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  agentic-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned gh-aw compiler
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c # v0.88.7
        with:
          version: v0.88.7
      - name: Verify agentic workflow source and lock files
        run: |
          gh aw compile --strict
          npm run agentic-workflows:check
          git diff --exit-code -- .github/workflows .github/aw/actions-lock.json

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:check
      - run: npm run docs:check
      - run: npm run docs:drift
      - run: npm run agent-findings:check
      - run: npm run agent-improvement:check
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: anthony-c-martin/setup-bicep@faf8170f496c10a2ea75977d2e77024131331404 # v1
        with:
          version: 0.45.6
      - run: bicep build infra/main.bicep
      - run: bicep build infra/admin-rbac.bicep
      - run: bicep build infra/private-network.bicep
      - run: bicep build infra/keyvault-private-network.bicep
      - run: bicep build infra/data-private-network.bicep
      - run: bicep build-params infra/dev.data-private-network.bicepparam
      - run: bicep build infra/monitoring.bicep
      - run: bicep build-params infra/dev.monitoring.bicepparam

  deployed-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the selected access mode
        env:
          ESP_TARGET_URL: ${{ inputs.target_url }}
          ESP_DEV_BYPASS: ${{ inputs.dev_bypass }}
        run: |
          if [ "$ESP_DEV_BYPASS" = "true" ]; then
            npm run test:smoke -- "$ESP_TARGET_URL" --dev-bypass
          else
            npm run test:smoke -- "$ESP_TARGET_URL"
          fi

  knowledge-evaluation:
    if: github.event_name == 'workflow_dispatch' && inputs.knowledge_evaluation && inputs.dev_bypass
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Evaluate current DEV sources
        env:
          ESP_TARGET_URL: ${{ inputs.target_url }}
        run: node scripts/evaluate-knowledge.mjs "$ESP_TARGET_URL" --report artifacts/knowledge-evaluation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: knowledge-evaluation
          path: artifacts/knowledge-evaluation.json
          if-no-files-found: warn
          retention-days: 14
