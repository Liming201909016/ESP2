name: Closed-loop Remediation Proof

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: remediation-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify two failure classes and automated rollback outcomes
        run: npm run remediation:check
      - name: Upload verified closed-loop remediation outcomes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: closed-loop-remediation-outcomes-${{ github.run_id }}
          path: dashboards/closed-loop-remediation-outcomes.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish machine-consumable remediation outcome
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const dashboard = JSON.parse(fs.readFileSync('dashboards/closed-loop-remediation-outcomes.json', 'utf8'));
            if (dashboard.distinctFailureClassCount !== 2 || dashboard.verifiedClosedLoopCount !== 2) {
              core.setFailed('Validated remediation dashboard did not contain two verified loops.');
              return;
            }
            await github.rest.checks.create({
              ...context.repo,
              name: 'remediation-outcome',
              head_sha: context.payload.pull_request?.head?.sha ?? context.sha,
              status: 'completed',
              conclusion: 'success',
              external_id: `closed-loop-remediation-${context.runId}`,
              output: {
                title: 'Two closed-loop remediation classes verified',
                summary: `Verified ${dashboard.verifiedClosedLoopCount} rollback loops across ${dashboard.distinctFailureClassCount} failure classes.`,
              },
            });
