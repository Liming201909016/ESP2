name: Closed-loop Remediation Proof

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: remediation-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify two failure classes and automated rollback outcomes
        run: npm run remediation:check
      - name: Upload verified closed-loop remediation outcomes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: closed-loop-remediation-outcomes-${{ github.run_id }}
          path: dashboards/closed-loop-remediation-outcomes.json
          if-no-files-found: error
          retention-days: 30
