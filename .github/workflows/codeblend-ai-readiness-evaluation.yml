name: CodeBlend AI Readiness

on:
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read
  copilot-requests: write

concurrency:
  group: codeblend-ai-readiness
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate repository
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.83 --no-audit --no-fund

      - name: Run CodeBlend evaluator
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evaluator="$GITHUB_WORKSPACE/.agents/skills/codeblend-ai-composite/ai-readiness-eval-linux-amd64"
          test -f "$evaluator"
          chmod +x "$evaluator"
          "$evaluator" eval "$GITHUB_WORKSPACE" 2>&1 | tee "$GITHUB_WORKSPACE/codeblend-evaluation.log"

          run_directory="$(sed -n 's/^artifacts: //p' "$GITHUB_WORKSPACE/codeblend-evaluation.log" | tail -n 1)"
          test -n "$run_directory"
          test -f "$run_directory/composite.md"
          cp -R "$run_directory" "$GITHUB_WORKSPACE/ai-readiness-report"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeblend-ai-readiness-${{ github.run_number }}
          path: |
            ai-readiness-report
            codeblend-evaluation.log
          if-no-files-found: warn
          retention-days: 30
