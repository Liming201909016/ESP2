name: Agent Review

on:
  workflow_dispatch:
    inputs:
      target_kind:
        description: Review an exact commit or same-repository pull request
        type: choice
        options: [commit, pull_request]
        required: true
      target:
        description: Full 40-character commit SHA or pull request number
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  copilot-requests: write

concurrency:
  group: agent-review-${{ inputs.target_kind }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  review:
    name: Read-only Agent Review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve exact review target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          TARGET_KIND: ${{ inputs.target_kind }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_KIND" == "commit" ]]; then
            [[ "$TARGET" =~ ^[a-f0-9]{40}$ ]]
            target_sha="$(gh api "repos/${{ github.repository }}/commits/$TARGET" --jq .sha)"
            base_sha="$(gh api "repos/${{ github.repository }}/commits/$TARGET" --jq '.parents[0].sha')"
            target_reference="$TARGET"
          else
            [[ "$TARGET" =~ ^[1-9][0-9]*$ ]]
            pull="$(gh api "repos/${{ github.repository }}/pulls/$TARGET")"
            [[ "$(jq -r '.head.repo.full_name' <<< "$pull")" == "${{ github.repository }}" ]]
            target_sha="$(jq -r '.head.sha' <<< "$pull")"
            base_sha="$(jq -r '.base.sha' <<< "$pull")"
            target_reference="#$TARGET"
          fi
          [[ "$target_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$base_sha" =~ ^[a-f0-9]{40}$ ]]
          {
            echo "target_sha=$target_sha"
            echo "base_sha=$base_sha"
            echo "target_reference=$target_reference"
          } >> "$GITHUB_OUTPUT"

      - name: Check out trusted review contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/copilot-code-review.yml
            .github/agents/esp-reviewer.agent.md
            docs/specs/esp-engineering-contract-v1.md
            scripts/agent-review-contract.mjs
          sparse-checkout-cone-mode: false

      - name: Check out target without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare bounded review context
        run: >-
          node trusted/scripts/agent-review-contract.mjs prepare
          --trusted-root "$GITHUB_WORKSPACE/trusted"
          --target-root "$GITHUB_WORKSPACE/target"
          --output-directory "$GITHUB_WORKSPACE/target/.agent-review-context"
          --repository "${{ github.repository }}"
          --target-kind "${{ inputs.target_kind }}"
          --target-reference "${{ steps.target.outputs.target_reference }}"
          --target-sha "${{ steps.target.outputs.target_sha }}"
          --base-sha "${{ steps.target.outputs.base_sha }}"

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.83 --no-audit --no-fund

      - name: Run read-only review
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prompt="$(cat "$GITHUB_WORKSPACE/target/.agent-review-context/review-prompt.txt")"
          copilot -p "$prompt" \
            -C "$GITHUB_WORKSPACE/target" \
            --model gpt-5.4 \
            --no-custom-instructions \
            --disable-builtin-mcps \
            --no-remote-export \
            --no-color \
            --no-ask-user \
            --no-auto-update \
            --disallow-temp-dir \
            --allow-all-tools \
            --output-format json \
            --usage-output-file "$RUNNER_TEMP/agent-review-usage.json" \
            --max-ai-credits 30 \
            --available-tools view rg glob > "$RUNNER_TEMP/copilot-events.jsonl"

      - name: Validate and finalize review artifact
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cli_version="$(copilot --version | sed -nE 's/^GitHub Copilot CLI ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
          [[ "$cli_version" == "1.0.83" ]]
          node trusted/scripts/agent-review-contract.mjs finalize \
            --context "$GITHUB_WORKSPACE/target/.agent-review-context/review-context.json" \
            --policy "$GITHUB_WORKSPACE/trusted/.github/copilot-code-review.yml" \
            --event-stream "$RUNNER_TEMP/copilot-events.jsonl" \
            --usage "$RUNNER_TEMP/agent-review-usage.json" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --model "gpt-5.4" \
            --copilot-cli-version "$cli_version" \
            --output-directory "$RUNNER_TEMP/agent-review-report"

      - name: Upload validated review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-review-${{ github.run_id }}-${{ steps.target.outputs.target_sha }}
          path: ${{ runner.temp }}/agent-review-report
          if-no-files-found: error
          retention-days: 30
