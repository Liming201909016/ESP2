name: CI Recovery

on:
  workflow_run:
    workflows: [Validate, Security]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun-failed-jobs:
    name: Rerun failed jobs once
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Request one failed-jobs rerun
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun-failed-jobs"
          echo "Requested one failed-jobs rerun for workflow run $RUN_ID." >> "$GITHUB_STEP_SUMMARY"
